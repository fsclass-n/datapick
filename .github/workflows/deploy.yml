# CI/CD: 변경된 영역만 검증(테스트·빌드)한다.
#   frontend/**                         -> lint + build
#   backend/**, rpa/**, requirements.txt -> pytest
#
# 배포 방식 (둘 중 하나만 사용, 중복 배포 방지)
#   A) 플랫폼 Git 연동(기본): Netlify/Render 가 main 푸시를 감지해 자동 배포
#      - Netlify: netlify.toml 의 ignore 로 frontend/ 변경 시에만 빌드
#      - Render : render.yaml 의 buildFilter 로 backend/·rpa/·requirements.txt 변경 시에만 배포
#      -> 아래 Secrets 를 등록하지 않으면 Actions 의 배포 단계는 건너뛴다.
#   B) Actions 주도: 플랫폼 자동 배포를 끄고 아래 Secrets 를 등록하면 테스트 통과 후 배포
#      secrets.NETLIFY_AUTH_TOKEN, secrets.NETLIFY_SITE_ID, secrets.RENDER_DEPLOY_HOOK_URL
#      vars.VITE_API_URL (예: https://dataquill-api.onrender.com)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - 'rpa/**'
              - 'requirements.txt'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Deploy to Netlify
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID 가 없어 배포를 건너뜁니다."
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --dir=dist --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest backend/tests -q
      - name: Deploy to Render
        if: github.event_name != 'pull_request'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL 이 없어 배포를 건너뜁니다."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
