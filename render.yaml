# Render Blueprint (Dashboard > New > Blueprint 로 연결하거나, 대시보드 수동 설정의 기준으로 사용)
# main 푸시 시 각 서비스의 buildFilter 경로가 바뀐 경우에만 해당 서비스가 자동 배포된다.
services:
  # ---------- 백엔드 API: https://datapick-api.onrender.com ----------
  - type: web
    name: datapick-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - rpa/**
        - requirements.txt
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: operator@datapick.io
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://datapick.onrender.com
      - key: BACKEND_URL
        value: https://datapick-api.onrender.com
      - key: CORS_ORIGINS
        value: https://datapick.onrender.com,https://datapick.netlify.app,https://datapick.duckdns.org,http://localhost:5173
      - key: DB_SSL
        value: "true"
      - key: SEED_TEST_ACCOUNTS
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false

  # ---------- 프런트엔드: https://datapick.onrender.com ----------
  - type: web
    name: datapick
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://datapick-api.onrender.com
      - key: NODE_VERSION
        value: "22"

  # ---------- (선택) 외부 ERP 연동 검증용 미니 ERP ----------
  # datapick 의 ERP_CONFIG url 을 이 서비스 주소로 지정해 로그인+전표 입력 실연동을 재현한다.
  # 별도 무료 서비스가 필요할 때만 주석을 해제해 사용한다.
