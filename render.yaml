# Render Blueprint (Dashboard > New > Blueprint 로 연결)
# main 푸시 시 buildFilter 경로가 바뀐 경우에만 자동 배포된다.
services:
  - type: web
    name: dataquill
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - rpa/**
        - requirements.txt
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://dataquill.netlify.app
      - key: BACKEND_URL
        value: https://dataquill.onrender.com
      - key: CORS_ORIGINS
        value: https://dataquill.netlify.app
      - key: ERP_URL
        value: http://localhost:10000/erp-demo
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
