# 로컬 통합 실행: docker compose up --build
#   프런트엔드 http://localhost:5173 / 백엔드 http://localhost:8000
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      ERP_URL: http://localhost:8000/erp-demo
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
