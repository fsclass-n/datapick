# Netlify: Base directory 를 frontend 로 지정한 경우 사용 (루트 netlify.toml 과 동일하게 유지)
[build]
  command = "npm run build"
  publish = "dist"
  # frontend/ 변경이 없으면 빌드를 건너뛴다 (첫 배포는 항상 빌드)
  ignore = "[ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
